# command line: main_unix.py --config config/nturgbd-cross-subject/vel.yaml --model model.BlockGCN.Model --work-dir work_dir/ntu60/xsub/vel --device 0 --batch-size 64 --test-batch-size 64 --num-epoch 140 --base-lr 0.0437

alpha: false
base_lr: 0.0437
batch_size: 64
config: config/nturgbd-cross-subject/vel.yaml
device:
- 0
ema: false
eval_interval: 5
feeder: feeders.feeder_ntu.Feeder
ignore_weights: []
joint_label: []
lambda_1: 0.0001
lambda_2: 0.1
log_interval: 100
lr_decay_rate: 0.1
model: model.BlockGCN.Model
model_args:
  graph: graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: spatial
  num_class: 60
  num_person: 2
  num_point: 25
  window_size: 64
model_saved_name: ''
momentum: 0.9
nesterov: true
num_epoch: 140
num_worker: 4
optimizer: SGD
phase: train
print_log: true
save_epoch: 10
save_interval: 1
save_score: true
seed: 1
show_topk:
- 1
- 5
start_epoch: 0
step:
- 110
- 120
test_batch_size: 64
test_feeder_args:
  bone: false
  data_path: data/ntu60/NTU60_CS.npz
  debug: false
  p_interval:
  - 0.95
  split: test
  vel: true
  window_size: 64
train_feeder_args:
  bone: false
  data_path: data/ntu60/NTU60_CS.npz
  debug: false
  normalization: false
  p_interval:
  - 0.5
  - 1
  random_choose: false
  random_move: false
  random_rot: true
  random_shift: false
  split: train
  vel: true
  window_size: 64
warm_up_epoch: 5
weight_decay: 0.0004
weights: null
work_dir: work_dir/ntu60/xsub/vel
